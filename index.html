<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Armita ♥</title>
<style>
:root{--bg:#07040c;--t:#fff;--g:rgba(255,255,255,.09);--b:rgba(255,255,255,.22);--p:#ff3d8b;--v:#8a5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;overflow:hidden;user-select:none}
body{background:radial-gradient(circle at 20% 15%,#4a1150 0,transparent 45%),radial-gradient(circle at 85% 85%,#1d1a6b 0,transparent 45%),var(--bg)}
canvas{position:fixed;inset:0;width:100%;height:100%}
.glass{background:var(--g);border:1px solid var(--b);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 40px rgba(0,0,0,.45);border-radius:22px}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;padding:12px 16px;z-index:5}
.row{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
#track{position:relative;height:10px;border-radius:9px;background:rgba(255,255,255,.12);margin:12px 6px 4px}
#bar{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--p),var(--v));box-shadow:0 0 14px var(--p);transition:width .3s}
#runner{position:absolute;top:-9px;right:0;font-size:22px;transform:translateX(50%);transition:right .3s;filter:drop-shadow(0 0 8px var(--p))}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px;transition:opacity .6s}
.card{max-width:380px;width:100%;padding:34px 24px;text-align:center}
h1{margin:0 0 8px;font-size:44px;background:linear-gradient(90deg,#ff7bb5,#b38cff);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:Georgia,serif;letter-spacing:2px}
p{margin:6px 0 22px;line-height:1.9;opacity:.85}
button{font:inherit;font-weight:800;font-size:18px;color:#fff;border:1px solid var(--b);padding:14px 38px;border-radius:50px;cursor:pointer;background:linear-gradient(135deg,rgba(255,61,139,.75),rgba(138,92,255,.75));box-shadow:0 0 28px rgba(255,61,139,.5),inset 0 1px 0 rgba(255,255,255,.4)}
button:active{transform:scale(.96)}
.hide{opacity:0;pointer-events:none}
.big{font-size:64px;font-weight:900;margin:6px 0;background:linear-gradient(90deg,#ffd1e6,#ff3d8b,#b38cff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop 1.4s ease-in-out infinite alternate}
@keyframes pop{to{transform:scale(1.08);filter:drop-shadow(0 0 18px #ff3d8b)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="glass hide">
  <div class="row"><span>♥ <b id="sc">0</b> / 15</span><span id="lv">مرحله ۱</span></div>
  <div class="row" style="font-size:13px;opacity:.8;margin-top:8px"><span>Armita</span><span>ممد</span></div>
  <div id="track"><div id="bar"></div><div id="runner">💗</div></div>
</div>

<div id="start" class="ov">
  <div class="card glass">
    <h1>Armita</h1>
    <p>قلب‌ها داره می‌بارن…<br>۱۵ تا قلب رو بگیر تا ببینی آخر این مسیر کیه 💫</p>
    <button id="go">شروع بازی</button>
  </div>
</div>

<div id="end" class="ov hide">
  <div class="card glass">
    <p style="margin:0">آرمیتا جان، آخر مسیر…</p>
    <div class="big">ممد</div>
    <p>کسی که همیشه منتظرته ♥<br>دوستت دارم، Armita</p>
    <button id="again">دوباره بازی کن</button>
  </div>
</div>

<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,D=Math.min(devicePixelRatio||1,2);
function rs(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}
rs();addEventListener('resize',rs);
let hearts=[],parts=[],stars=[],score=0,playing=false,spawn=0,last=0;
for(let i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.3,s:Math.random()*.0004+.0001});
const cols=['#ff3d8b','#ff7bb5','#b38cff','#ff5e5e','#ffd1e6'];
function heart(cx,cy,s,col,a=1){x.save();x.globalAlpha=a;x.translate(cx,cy);x.scale(s/30,s/30);x.beginPath();x.moveTo(0,10);x.bezierCurveTo(-30,-10,-14,-34,0,-16);x.bezierCurveTo(14,-34,30,-10,0,10);x.fillStyle=col;x.shadowColor=col;x.shadowBlur=22;x.fill();x.restore()}
function burst(px,py,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*4+1.5;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:col||cols[i%5],s:Math.random()*8+6})}}
function add(){const s=Math.random()*18+32;hearts.push({x:Math.random()*(W-80)+40,y:-40,s,v:(Math.random()*.7+.9)*(1+score*.06),c:cols[Math.random()*5|0],ph:Math.random()*6})}
function hit(px,py){if(!playing)return;for(let i=hearts.length-1;i>=0;i--){const h=hearts[i];if(Math.hypot(px-h.x,py-h.y)<h.s*1.2){hearts.splice(i,1);burst(h.x,h.y,14,h.c);score++;upd();return}}}
function upd(){document.getElementById('sc').textContent=score;const p=score/15*100;document.getElementById('bar').style.width=p+'%';document.getElementById('runner').style.right=p+'%';document.getElementById('lv').textContent='مرحله '+(Math.min(5,Math.floor(score/3)+1));if(score>=15)win()}
function win(){playing=false;hearts=[];for(let i=0;i<8;i++)setTimeout(()=>burst(Math.random()*W,Math.random()*H*.7,40),i*220);setTimeout(()=>{document.getElementById('end').classList.remove('hide');document.getElementById('hud').classList.add('hide')},900)}
function begin(){score=0;hearts=[];upd();playing=true;document.getElementById('start').classList.add('hide');document.getElementById('end').classList.add('hide');document.getElementById('hud').classList.remove('hide')}
document.getElementById('go').onclick=begin;document.getElementById('again').onclick=begin;
cv.addEventListener('pointerdown',e=>hit(e.clientX,e.clientY));
function loop(t){const dt=Math.min(t-last,50);last=t;x.clearRect(0,0,W,H);
 stars.forEach(s=>{s.y=(s.y+s.s*dt)%1;x.fillStyle='rgba(255,255,255,'+(.3+Math.sin(t*.002+s.x*9)*.3)+')';x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,6.28);x.fill()});
 if(playing){spawn-=dt;if(spawn<=0){add();spawn=Math.max(380,900-score*30)}}
 hearts.forEach(h=>{h.y+=h.v*dt*.12;heart(h.x+Math.sin(t*.002+h.ph)*14,h.y,h.s,h.c)});
 hearts=hearts.filter(h=>h.y<H+50);
 parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l-=.018;heart(p.x,p.y,p.s,p.c,Math.max(p.l,0))});
 parts=parts.filter(p=>p.l>0);
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
